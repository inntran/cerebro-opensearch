# Application overrides. Prefer environment variables in containers.
# CEREBRO_SECRET / PLAY_HTTP_SECRET_KEY — session signing (auto-generated under data.path when using CerebroApp)
# CEREBRO_DATA — data directory (default ./data)
# CEREBRO_PORT — HTTP port
# CEREBRO_AUDIT — true/false for audit logging
# CEREBRO_BLOCK_PRIVATE_NETWORKS — true to block RFC1918/link-local/metadata for ad-hoc URLs

pidfile.path = /dev/null

play {
  server.http.port = 9000
  server.http.port = ${?CEREBRO_PORT}
}

# Bookmarks: addresses only. Credentials belong on the connect form / session.
hosts = [
  #{
  #  host = "https://opensearch.example:9200"
  #  name = "example-cluster"
  #}
]
