# Defaults — overridden by application.conf and environment.
play.http.secret.key = "changeme-dev-only"
play.http.secret.key = ${?CEREBRO_SECRET}
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

opensearch {
  gzip = false
}
play.ws.compressionEnabled = ${opensearch.gzip}

play.i18n.langs = ["en"]

basePath = "/"
play.http.context = ${basePath}

rest.history.size = 50

data.path = "./data"
data.path = ${?CEREBRO_DATA}

slick.dbs.default.profile = "slick.jdbc.SQLiteProfile$"
slick.dbs.default.db.driver = org.sqlite.JDBC
slick.dbs.default.db.url = "jdbc:sqlite:"${data.path}"/cerebro.db"
play.evolutions.db.default.autoApply = true

audit {
  enabled = false
  enabled = ${?CEREBRO_AUDIT}
}

security {
  block_private_networks = false
  block_private_networks = ${?CEREBRO_BLOCK_PRIVATE_NETWORKS}
  allowed_schemes = ["http", "https"]
}

hosts = []
