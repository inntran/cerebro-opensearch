name: Continuous Integration

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-26.04]
        scala: [2.13.18]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@25)
        if: matrix.java == 'temurin@25'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Angular frontend
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm run lint
          npm test
          npm run smoke

      - name: Check that workflows are up to date
        run: sbt githubWorkflowCheck

      - name: Backend test
        run: sbt test

  container:
    name: Container smoke
    strategy:
      matrix:
        os: [ubuntu-26.04]
        scala: [2.13.18]
        java: [temurin@25]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (fast)
        uses: actions/checkout@v7

      - name: Build and smoke image with Podman (OpenSearch latest + 2.x)
        run: |
          set -euo pipefail
          podman --version
          buildah --version
          podman build -t localhost/cerebro-opensearch:ci -f Containerfile .
          CEREBRO_IMAGE=localhost/cerebro-opensearch:ci CEREBRO_URL=http://127.0.0.1:9000 bash scripts/smoke-opensearch-matrix.sh
