# Disposable OpenSearch clusters for local smoke tests. Do not point at production.
#
#   podman compose up -d opensearch      # current major (latest)
#   podman compose up -d opensearch2     # latest 2.x line
#   podman compose --profile full up -d  # cerebro + default opensearch

services:
  opensearch:
    image: public.ecr.aws/opensearchproject/opensearch:latest
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  opensearch2:
    image: public.ecr.aws/opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  cerebro:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "9000:9000"
    environment:
      CEREBRO_DATA: /data
      CEREBRO_PORT: "9000"
      CEREBRO_AUDIT: "true"
    volumes:
      - cerebro-data:/data
    depends_on:
      opensearch:
        condition: service_healthy
    profiles:
      - full

volumes:
  cerebro-data:
